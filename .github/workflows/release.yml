name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# 同一 tag 只跑一条流水线；不取消进行中的任务，避免 release 传了一半
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    strategy:
      # 一个平台失败不影响另一个平台继续产出
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            label: macOS universal
            # universal 需要两个架构的 std，构建时各编一遍再 lipo
            target: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - platform: windows-latest
            label: Windows x64
            target: ""
            args: ""

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存 Rust 构建
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          # 两个平台共用同一份缓存会互相污染，按 label 分开
          key: ${{ matrix.label }}

      - name: 安装前端依赖
        # 用 npm ci 保证与 package-lock.json 完全一致
        run: npm ci

      - name: 构建并上传到 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          # 手动触发时没有 tag，留空即只构建、不碰 Release
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "NexusTerm __VERSION__"
          releaseDraft: true
          prerelease: false
          releaseBody: |
            NexusTerm __VERSION__

            ### 安装

            - **macOS**：下载 `.dmg`，打开后把 NexusTerm 拖进「应用程序」。
              本包为通用二进制（Apple Silicon + Intel），未做代码签名与公证，
              首次启动若被 Gatekeeper 拦下，右键点击图标选「打开」，
              或在终端执行一次：

              ```bash
              xattr -dr com.apple.quarantine /Applications/NexusTerm.app
              ```

            - **Windows**：下载 `-setup.exe` 直接安装（当前用户级安装，无需管理员权限）。
              未签名，SmartScreen 可能提示「更多信息 → 仍要运行」。

            ### 说明

            这是预发布版本，接口与配置格式仍可能调整。遇到问题请开 issue 并附上
            系统版本与复现步骤。

      - name: 手动触发时留存构建产物
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: nexusterm-${{ matrix.platform }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app
            src-tauri/target/**/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
